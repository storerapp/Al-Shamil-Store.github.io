services:
  - type: web
    name: al-shamil-vault
    runtime: node
    plan: starter
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        generateValue: true
      - key: PANEL_ENABLED
        value: "false"
      - key: PANEL_URL
        value: "https://panel.example.com"
      - key: PANEL_PUBLIC_URL
        value: "https://panel.example.com"
      - key: PANEL_EGG_ID
        value: "15"
      - key: PANEL_LOCATION_ID
        value: "1"
      - key: PANEL_EMAIL_DOMAIN
        sync: false
      - key: PANEL_API_KEY
        sync: false
      - key: PANEL_NEST_ID
        sync: false
      - key: PANEL_DOCKER_IMAGE
        sync: false
      - key: PANEL_STARTUP
        sync: false
      - key: PANEL_MEMORY_MB
        value: "1024"
      - key: PANEL_DISK_MB
        value: "5120"
      - key: PANEL_CPU
        value: "100"
      - key: PANEL_SWAP_MB
        value: "0"
      - key: PANEL_IO
        value: "500"
      - key: PANEL_DATABASE_LIMIT
        value: "1"
      - key: PANEL_ALLOCATION_LIMIT
        value: "1"
      - key: PANEL_BACKUP_LIMIT
        value: "0"
      - key: PANEL_SERVER_PREFIX
        value: "Al-Shamil"
      - key: PANEL_PORT_RANGE
        value: ""
      - key: PANEL_ENVIRONMENT_JSON
        value: "{}"
      - key: DATABASE_URL
        fromDatabase:
          name: al-shamil-vault-db
          property: connectionString

databases:
  - name: al-shamil-vault-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "18"
    databaseName: alshamil
    user: alshamil
    diskSizeGB: 1
    connectionPool: pgbouncer
